<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WHOOP 周总结</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e0e14;color:#e8e8f0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px;max-width:760px;margin:0 auto}
h1{font-size:20px;text-align:center;margin-bottom:4px}
.sub{text-align:center;color:#8a8a9a;font-size:12px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.stat{background:#1a1a24;border-radius:12px;padding:12px 8px;text-align:center}
.stat .n{font-size:22px;font-weight:700}
.stat .l{font-size:11px;color:#8a8a9a;margin-top:3px}
.card{background:#1a1a24;border-radius:14px;padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.legend{font-size:11px;color:#8a8a9a;margin-top:8px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
svg{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 4px;text-align:center;border-bottom:1px solid #2a2a36}
th{color:#8a8a9a;font-weight:600}
td.d{color:#aaa;white-space:nowrap}
.z-g{color:#00e676}.z-y{color:#ffd54f}.z-r{color:#ff5252}
.foot{text-align:center;color:#6a6a7a;font-size:11px;margin-top:10px;line-height:1.6}
.ins{background:#14141c;border-left:3px solid #4a9eff;border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.7;color:#c8c8d4}
.ins b{color:#fff}
</style></head><body>
<h1>⌚ WHOOP 周总结</h1>
<div class="sub">2026-10-27 ~ 2026-11-02 · 共 7 天</div>
<div class="stats" id="stats"></div>
<div class="card"><h2>🔋 恢复度走势</h2><svg id="recChart" viewBox="0 0 700 260"></svg>
<div class="legend"><span><i class="dot" style="background:#00e676"></i>绿 ≥67</span><span><i class="dot" style="background:#ffd54f"></i>黄 34-66</span><span><i class="dot" style="background:#ff5252"></i>红 &lt;34</span></div></div>
<div class="card"><h2>😴 睡眠时长（小时）</h2><svg id="sleepChart" viewBox="0 0 700 220"></svg></div>
<div class="card"><h2>❤️ HRV 与静息心率</h2><svg id="hrChart" viewBox="0 0 700 240"></svg>
<div class="legend"><span><i class="dot" style="background:#4a9eff"></i>HRV(ms) 越高越好</span><span><i class="dot" style="background:#ff8a65"></i>静息心率(bpm) 越低越好</span></div></div>
<div class="card"><h2>📋 每日明细</h2><div style="overflow-x:auto"><table id="tbl"></table></div></div>
<div class="card"><h2>💡 本周小结</h2><div class="ins" id="insight"></div></div>
<div class="foot">数据来源 WHOOP API · 小亿自动整理 · 2026-11-02 15:00</div>
<script>
const D=[{"date": "10-27", "rec": 26, "zone": "r", "strain": 11.3, "slp": 31, "rhr": 49, "hrv": 55.6, "spo2": 88.2, "sh": 3.34, "eff": 95.7}, {"date": "10-28", "rec": 43, "zone": "y", "strain": 7.3, "slp": 46, "rhr": 59, "hrv": 40.3, "spo2": 92.8, "sh": 7.32, "eff": 70.2}, {"date": "10-29", "rec": 73, "zone": "g", "strain": 10.5, "slp": 78, "rhr": 53, "hrv": 55.0, "spo2": 89.7, "sh": 7.49, "eff": 98.5}, {"date": "10-30", "rec": 84, "zone": "g", "strain": 18.6, "slp": 77, "rhr": 51, "hrv": 62.3, "spo2": 90.6, "sh": 7.07, "eff": 95.3}, {"date": "10-31", "rec": 37, "zone": "y", "strain": 11.5, "slp": 67, "rhr": 55, "hrv": 42.0, "spo2": 92.9, "sh": 5.5, "eff": 89.3}, {"date": "11-01", "rec": 87, "zone": "g", "strain": 5.0, "slp": 77, "rhr": 54, "hrv": 62.5, "spo2": 92.8, "sh": 7.86, "eff": 91.8}, {"date": "11-02", "rec": 40, "zone": "y", "strain": 4.3, "slp": 77, "rhr": 53, "hrv": 41.3, "spo2": 95.8, "sh": 7.61, "eff": 92.3}];
const ZC={g:"#00e676",y:"#ffd54f",r:"#ff5252",n:"#888"};
const has=a=>a.filter(x=>x!=null);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const h2hm=h=>{if(h==null)return "—";const m=Math.round(h*60);return Math.floor(m/60)+"h"+String(m%60).padStart(2,"0")+"m"};
const avgRec=Math.round(avg(has(D.map(d=>d.rec))));
const shArr=has(D.map(d=>d.sh));const avgSh=avg(shArr);
const avgHrv=avg(has(D.map(d=>d.hrv))).toFixed(0);
const best=D.reduce((a,b)=>b.rec>a.rec?b:a);
document.getElementById("stats").innerHTML=[
["平均恢复",avgRec+"%",avgRec>=67?"z-g":avgRec>=34?"z-y":"z-r"],
["平均睡眠",h2hm(avgSh),""],["平均HRV",avgHrv+"ms",""],["最佳日",best.date,"z-g"]
].map(s=>`<div class="stat"><div class="n ${s[2]}">${s[1]}</div><div class="l">${s[0]}</div></div>`).join("");
const PL=44,PR=16,PT=16;
const xpos=(i,w)=>D.length<2?(PL+(w-PL-PR)/2):PL+(w-PL-PR)*i/(D.length-1);
(function(){const W=700,H=260,PB=34,top=PT,bot=H-PB,y=v=>top+(bot-top)*(1-v/100);let s="";
[[67,100,"#00e67622"],[34,67,"#ffd54f18"],[0,34,"#ff525218"]].forEach(b=>{const y1=y(b[1]),y2=y(b[0]);s+=`<rect x="${PL}" y="${y1}" width="${W-PL-PR}" height="${y2-y1}" fill="${b[2]}"/>`;});
[0,25,50,75,100].forEach(v=>{s+=`<line x1="${PL}" y1="${y(v)}" x2="${W-PR}" y2="${y(v)}" stroke="#2a2a36"/><text x="${PL-6}" y="${y(v)+4}" fill="#6a6a7a" font-size="11" text-anchor="end">${v}</text>`;});
let pts=D.map((d,i)=>[xpos(i,W),y(d.rec)]);
s+=`<polyline fill="none" stroke="#fff" stroke-width="2" stroke-opacity=".55" points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
D.forEach((d,i)=>{const[px,py]=pts[i];s+=`<circle cx="${px}" cy="${py}" r="5" fill="${ZC[d.zone]}" stroke="#0e0e14" stroke-width="2"/><text x="${px}" y="${py-11}" fill="${ZC[d.zone]}" font-size="12" font-weight="700" text-anchor="middle">${d.rec}</text><text x="${px}" y="${H-12}" fill="#8a8a9a" font-size="11" text-anchor="middle">${d.date}</text>`;});
document.getElementById("recChart").innerHTML=s;})();
(function(){const W=700,H=220,PB=30,top=PT,bot=H-PB,mx=10,y=v=>top+(bot-top)*(1-v/mx);let s="";
[0,2,4,6,8,10].forEach(v=>{s+=`<line x1="${PL}" y1="${y(v)}" x2="${W-PR}" y2="${y(v)}" stroke="#2a2a36"/><text x="${PL-6}" y="${y(v)+4}" fill="#6a6a7a" font-size="11" text-anchor="end">${v}</text>`;});
const bw=(W-PL-PR)/D.length*0.56;
D.forEach((d,i)=>{const cx=xpos(i,W);if(d.sh==null){s+=`<text x="${cx}" y="${bot-4}" fill="#555" font-size="10" text-anchor="middle">无</text>`;}else{const yy=y(d.sh),h=bot-yy,col=d.sh>=7?"#4a9eff":d.sh>=5?"#9a7cff":"#ff7eb0";s+=`<rect x="${cx-bw/2}" y="${yy}" width="${bw}" height="${h}" rx="4" fill="${col}"/><text x="${cx}" y="${yy-6}" fill="#c8c8d4" font-size="11" font-weight="600" text-anchor="middle">${h2hm(d.sh)}</text>`;}s+=`<text x="${cx}" y="${H-10}" fill="#8a8a9a" font-size="11" text-anchor="middle">${d.date}</text>`;});
s+=`<line x1="${PL}" y1="${y(7)}" x2="${W-PR}" y2="${y(7)}" stroke="#4a9eff" stroke-dasharray="4 4" stroke-opacity=".6"/><text x="${W-PR}" y="${y(7)-5}" fill="#4a9eff" font-size="10" text-anchor="end">7h 参考</text>`;
document.getElementById("sleepChart").innerHTML=s;})();
(function(){const W=700,H=240,PB=34,top=PT,bot=H-PB;const hM=70,hm=35,rM=62,rm=46;
const yH=v=>top+(bot-top)*(1-(v-hm)/(hM-hm)),yR=v=>top+(bot-top)*(1-(v-rm)/(rM-rm));let s="";
[35,45,55,65].forEach(v=>{s+=`<line x1="${PL}" y1="${yH(v)}" x2="${W-PR}" y2="${yH(v)}" stroke="#2a2a36"/><text x="${PL-6}" y="${yH(v)+4}" fill="#4a9eff" font-size="10" text-anchor="end">${v}</text>`;});
let ph=D.map((d,i)=>[xpos(i,W),yH(d.hrv)]),pr=D.map((d,i)=>[xpos(i,W),yR(d.rhr)]);
s+=`<polyline fill="none" stroke="#4a9eff" stroke-width="2" points="${ph.map(p=>p.join(",")).join(" ")}"/>`;
s+=`<polyline fill="none" stroke="#ff8a65" stroke-width="2" points="${pr.map(p=>p.join(",")).join(" ")}"/>`;
D.forEach((d,i)=>{s+=`<circle cx="${ph[i][0]}" cy="${ph[i][1]}" r="4" fill="#4a9eff"/><text x="${ph[i][0]}" y="${ph[i][1]-9}" fill="#4a9eff" font-size="10" text-anchor="middle">${d.hrv}</text><circle cx="${pr[i][0]}" cy="${pr[i][1]}" r="4" fill="#ff8a65"/><text x="${pr[i][0]}" y="${pr[i][1]+16}" fill="#ff8a65" font-size="10" text-anchor="middle">${d.rhr}</text><text x="${xpos(i,W)}" y="${H-12}" fill="#8a8a9a" font-size="11" text-anchor="middle">${d.date}</text>`;});
document.getElementById("hrChart").innerHTML=s;})();
(function(){const zc={g:"z-g",y:"z-y",r:"z-r",n:""},zt={g:"🟢",y:"🟡",r:"🔴",n:"⚪"};
let s=`<tr><th>日期</th><th>恢复</th><th>睡眠</th><th>时长</th><th>效率</th><th>HRV</th><th>RHR</th><th>血氧</th></tr>`;
D.forEach(d=>{s+=`<tr><td class="d">${d.date}</td><td class="${zc[d.zone]}">${zt[d.zone]}${d.rec}%</td><td>${d.slp==null?"—":d.slp+"%"}</td><td>${h2hm(d.sh)}</td><td>${d.eff==null?"—":d.eff+"%"}</td><td>${d.hrv}</td><td>${d.rhr}</td><td>${d.spo2}%</td></tr>`;});
document.getElementById("tbl").innerHTML=s;})();
(function(){const worst=D.reduce((a,b)=>b.rec<a.rec?b:a);
const sv=D.filter(d=>d.sh!=null);const bestS=sv.reduce((a,b)=>b.sh>a.sh?b:a,sv[0]||{sh:0,date:"—"});const worstS=sv.reduce((a,b)=>b.sh<a.sh?b:a,sv[0]||{sh:0,date:"—"});
const green=D.filter(d=>d.zone==="g").length,red=D.filter(d=>d.zone==="r").length;
document.getElementById("insight").innerHTML=
`· 本周 ${D.length} 天平均恢复度 <b>${avgRec}%</b>（${avgRec>=67?"绿色·状态好":avgRec>=34?"黄色·一般":"红色·偏疲劳"}）；其中绿区 <b>${green}</b> 天、红区 <b>${red}</b> 天。<br>`+
`· 最佳 <b>${best.date}（${best.rec}%）</b>，最差 <b>${worst.date}（${worst.rec}%）</b>。<br>`+
`· 睡眠平均 <b>${h2hm(avgSh)}</b>，最长 <b>${h2hm(bestS.sh)}（${bestS.date}）</b>，最短 <b>${h2hm(worstS.sh)}（${worstS.date}）</b>。<br>`+
`<b>规律：睡够 7 小时的第二天，恢复度通常明显更高。稳定作息、睡满 7h 是最直接的提升办法。</b>`;})();
</script></body></html>
