<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>GYT WHOOP 周总结</title>
<style>
:root{--bg:#08090b;--s1:#121418;--s2:#1b1e24;--hair:rgba(255,255,255,.07);--tx:#f2f4f7;--tx2:#9aa2ad;--tx3:#5f6773;
--g:#1fe08a;--y:#ffb43a;--r:#ff5a5f;--strain:#35b8ff;--sleep:#a78bfa;--hrv:#2fd6c6;--rhr:#ff9566;
--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans CJK SC","Helvetica Neue",sans-serif;
--mono:"SF Mono",ui-monospace,Menlo,"JetBrains Mono","Roboto Mono",Consolas,monospace;--glow:31,224,138}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{color:var(--tx);font-family:var(--sans);-webkit-font-smoothing:antialiased;max-width:520px;margin:0 auto;padding:0 16px 48px;line-height:1.5;position:relative;overflow-x:hidden}
.glow{position:absolute;left:-40%;right:-40%;top:-160px;height:420px;background:radial-gradient(closest-side,rgba(var(--glow),.17),transparent);pointer-events:none}
header{position:relative;padding:32px 2px 18px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--tx3);text-transform:uppercase}
.eyebrow b{color:rgb(var(--glow));font-weight:600}
h1{font-size:26px;font-weight:700;letter-spacing:-.025em;margin-top:8px;line-height:1.2}
.lede{color:var(--tx2);font-size:13.5px;margin-top:6px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.seg{position:sticky;top:0;z-index:20;margin:0 -16px 16px;padding:10px 16px;background:rgba(8,9,11,.8);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px)}
.seg div{display:flex;background:var(--s1);border-radius:11px;padding:3px;box-shadow:inset 0 0 0 1px var(--hair)}
.seg button{flex:1;border:0;background:none;color:var(--tx2);font:600 13px/1 var(--sans);padding:9px 0;border-radius:8px;cursor:pointer;transition:background .2s,color .2s}
.seg button.on{background:#2a2e36;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.panel{display:none;position:relative}
.panel.on{display:block;animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--s1);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:inset 0 0 0 1px var(--hair)}
.ttl{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.ttl h2{font-size:15px;font-weight:650;letter-spacing:-.01em}
.ttl span{font-size:11.5px;color:var(--tx3)}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.ring{background:var(--s1);border-radius:18px;padding:14px 8px 12px;text-align:center;box-shadow:inset 0 0 0 1px var(--hair)}
.gauge{position:relative;width:84%;margin:0 auto;aspect-ratio:1}
.gauge svg{position:absolute;inset:0;width:100%;height:100%}
.trk{fill:none;stroke:rgba(255,255,255,.07);stroke-width:8}
.arc{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rv b{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1}
.rv small{font-family:var(--mono);font-size:10px;color:var(--tx3);margin-top:4px}
.rl{font-size:12.5px;font-weight:600;margin-top:10px}
.rn{font-size:11px;color:var(--tx3);margin-top:1px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);background:var(--s1);border-radius:18px;margin-bottom:12px;box-shadow:inset 0 0 0 1px var(--hair)}
.trio>div{padding:13px 14px}
.trio>div+div{border-left:1px solid var(--hair)}
.trio .k{font-size:11.5px;color:var(--tx3)}
.trio .v{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:3px;letter-spacing:-.02em}
.trio .v small{font-size:11px;color:var(--tx3);margin-left:2px;font-weight:400}
.verdict h3{font-size:17px;font-weight:650;letter-spacing:-.015em;line-height:1.4}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);background:var(--s2);padding:5px 10px;border-radius:999px}
.chip i{width:7px;height:7px;border-radius:50%}
.chip b{font-family:var(--mono);color:var(--tx);font-weight:600}
.hm{display:grid;grid-template-columns:34px repeat(var(--n),1fr);gap:5px;align-items:center}
.hm .h{text-align:center;font-size:12px;font-weight:600;color:var(--tx2);line-height:1.15;padding-bottom:2px}
.hm .h small{display:block;font-family:var(--mono);font-size:9px;color:var(--tx3);font-weight:400;margin-top:2px}
.hm .lb{font-size:11px;color:var(--tx3)}
.hm .c{height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:-.02em}
.ins li{list-style:none;position:relative;padding:10px 0 10px 16px;font-size:13.5px;line-height:1.65;color:#d5d9df;border-top:1px solid var(--hair)}
.ins li:first-child{border-top:0;padding-top:0}
.ins li::before{content:"";position:absolute;left:0;top:19px;width:5px;height:5px;border-radius:50%;background:rgb(var(--glow))}
.ins li:first-child::before{top:9px}
.ins b{color:#fff;font-weight:650}
.ins .num{color:#fff}
.ph{padding:2px 2px 16px}
.ph .k{font-size:12px;color:var(--tx3)}
.ph .big{font-family:var(--mono);font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1.05;margin-top:4px}
.ph .big small{font-size:16px;color:var(--tx3);margin:0 3px 0 2px;letter-spacing:0;font-weight:400}
.ph .meta{display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--tx2);flex-wrap:wrap}
.ph .meta b{font-family:var(--mono);color:var(--tx);font-weight:600;margin-left:3px}
svg.ch{width:100%;height:auto;display:block;overflow:visible}
svg.ch text{font-family:var(--mono)}
.lg{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--tx3)}
.lg span{display:inline-flex;align-items:center;gap:5px}
.lg i{width:8px;height:8px;border-radius:50%}
.rows{background:var(--s1);border-radius:18px;padding:2px 16px;margin-bottom:12px;box-shadow:inset 0 0 0 1px var(--hair)}
.row{display:grid;grid-template-columns:40px 1fr 122px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--hair)}
.row:first-child{border-top:0}
.row .d{font-size:13px;font-weight:600;line-height:1.15}
.row .d small{display:block;font-family:var(--mono);font-size:10px;color:var(--tx3);font-weight:400;margin-top:3px}
.track{position:relative;height:8px;border-radius:99px;background:rgba(255,255,255,.06)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.track .goal{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:2px;background:rgba(255,255,255,.4)}
.row .v{text-align:right;font-family:var(--mono);font-size:14px;font-weight:600}
.row .v small{display:block;font-size:10px;color:var(--tx3);font-weight:400;margin-top:2px}
.note{display:flex;gap:12px;background:linear-gradient(180deg,rgba(var(--glow),.09),rgba(var(--glow),.03));border-radius:16px;padding:14px 16px;font-size:13px;line-height:1.7;color:#cfd4db;box-shadow:inset 0 0 0 1px rgba(var(--glow),.2);margin-bottom:12px}
.note .t{font-weight:650;color:rgb(var(--glow));white-space:nowrap}
.note .num{color:#fff}
.still *{animation:none!important;transition:none!important}
</style></head><body>
<div class="glow"></div>
<header>
  <div class="eyebrow">Weekly Report · <b id="rg"></b></div>
  <h1>GYT WHOOP 周总结</h1>
  <div class="lede" id="lede"></div>
</header>
<nav class="seg"><div>
  <button class="on" data-t="ov">概览</button><button data-t="rec">恢复</button><button data-t="slp">睡眠</button><button data-t="str">负荷</button>
</div></nav>

<section class="panel on" id="p-ov">
  <div class="rings" id="rings"></div>
  <div class="trio" id="trio"></div>
  <div class="card verdict"><h3 id="vd"></h3><div class="chips" id="chips"></div></div>
  <div class="card"><div class="ttl"><h2>本周节奏</h2><span>颜色越亮，数值越高</span></div><div class="hm" id="hm"></div></div>
  <div class="card"><div class="ttl"><h2>本周小结</h2></div><ul class="ins" id="ins"></ul></div>
</section>

<section class="panel" id="p-rec">
  <div class="ph" id="phRec"></div>
  <div class="card"><div class="ttl"><h2>恢复度走势</h2><span>虚线为周均</span></div><svg class="ch" id="cRec"></svg>
    <div class="lg"><span><i style="background:var(--g)"></i>充沛 ≥67</span><span><i style="background:var(--y)"></i>一般 34–66</span><span><i style="background:var(--r)"></i>疲劳 &lt;34</span></div></div>
  <div class="card"><div class="ttl"><h2>HRV</h2><span>越高越好 · ms</span></div><svg class="ch" id="cHrv"></svg></div>
  <div class="card"><div class="ttl"><h2>静息心率</h2><span>越低越好 · bpm</span></div><svg class="ch" id="cRhr"></svg></div>
  <div class="rows" id="lRec"></div>
  <div class="note" id="nRec"></div>
</section>

<section class="panel" id="p-slp">
  <div class="ph" id="phSlp"></div>
  <div class="card"><div class="ttl"><h2>睡眠时长</h2><span>虚线为 7 小时目标</span></div><svg class="ch" id="cSlp"></svg></div>
  <div class="rows" id="lSlp"></div>
</section>

<section class="panel" id="p-str">
  <div class="ph" id="phStr"></div>
  <div class="card"><div class="ttl"><h2>运动负荷</h2><span>底部圆点 = 当天恢复</span></div><svg class="ch" id="cStr"></svg>
    <div class="lg"><span>轻 0–9</span><span>中 10–13</span><span>高 14–17</span><span>极高 18–21</span></div></div>
  <div class="rows" id="lStr"></div>
</section>
<script>
const D=[{"date": "10-31", "rec": 83, "zone": "g", "strain": 13.0, "slp": 79, "rhr": 58, "hrv": 65.5, "spo2": 90.2, "sh": 6.35, "eff": 92.7}, {"date": "11-01", "rec": 72, "zone": "g", "strain": 6.9, "slp": 81, "rhr": 60, "hrv": 54.6, "spo2": 94.3, "sh": 9.81, "eff": 89.7}, {"date": "11-02", "rec": 62, "zone": "y", "strain": 5.0, "slp": 73, "rhr": 65, "hrv": 47.2, "spo2": 94.8, "sh": 9.34, "eff": 84.5}, {"date": "11-03", "rec": 70, "zone": "g", "strain": 16.0, "slp": 63, "rhr": 61, "hrv": 54.3, "spo2": 94.2, "sh": 6.23, "eff": 83.4}, {"date": "11-04", "rec": 61, "zone": "y", "strain": 4.2, "slp": 71, "rhr": 61, "hrv": 48.3, "spo2": 95.0, "sh": 6.63, "eff": 89.0}, {"date": "11-05", "rec": 83, "zone": "g", "strain": 6.2, "slp": 63, "rhr": 60, "hrv": 56.7, "spo2": 92.1, "sh": 7.24, "eff": 82.2}, {"date": "11-06", "rec": 17, "zone": "r", "strain": 1.1, "slp": 28, "rhr": 67, "hrv": 39.0, "spo2": 95.0, "sh": 3.25, "eff": 93.1}];
const RANGE="2026-10-31 ~ 2026-11-06 · 共 7 天";
const $=id=>document.getElementById(id);
const cv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const COL={g:cv('--g'),y:cv('--y'),r:cv('--r'),n:cv('--tx3'),strain:cv('--strain'),sleep:cv('--sleep'),hrv:cv('--hrv'),rhr:cv('--rhr'),tx2:cv('--tx2'),tx3:cv('--tx3')};
const rgb=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255].join(',')};
const rgba=(h,a)=>`rgba(${rgb(h)},${a})`;
const ok=v=>v!=null&&!isNaN(v);
const avg=a=>{a=a.filter(ok);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
const hm=h=>{if(!ok(h))return"—";const m=Math.round(h*60);return Math.floor(m/60)+"h"+String(m%60).padStart(2,"0")};
const f1=v=>ok(v)?(+v).toFixed(1):"—";
const r0=v=>ok(v)?Math.round(v):"—";
const zoneOf=v=>!ok(v)?"n":v>=67?"g":v>=34?"y":"r";
const ZN={g:"充沛",y:"一般",r:"疲劳",n:"—"};
const lvl=v=>v>=18?"极高":v>=14?"高":v>=10?"中":"轻";
const N=D.length;
const m0=RANGE.match(/(\d{4})-(\d{2})-(\d{2})/),Y0=m0?+m0[1]:new Date().getFullYear(),M0=m0?+m0[2]:1;
const WD="日一二三四五六";
D.forEach(d=>{const[m,dd]=d.date.split("-").map(Number);const w=WD[new Date(m<M0?Y0+1:Y0,m-1,dd).getDay()];d.w=w;d.wd="周"+w;d.md=m+"/"+String(dd).padStart(2,"0");if(!d.zone)d.zone=zoneOf(d.rec);});
const A={rec:avg(D.map(d=>d.rec)),str:avg(D.map(d=>d.strain)),slp:avg(D.map(d=>d.slp)),sh:avg(D.map(d=>d.sh)),hrv:avg(D.map(d=>d.hrv)),rhr:avg(D.map(d=>d.rhr)),eff:avg(D.map(d=>d.eff))};
const pick=(k,f)=>{const a=D.filter(d=>ok(d[k]));return a.length?a.reduce((x,y)=>f(y[k],x[k])?y:x):null};
const best=pick("rec",(a,b)=>a>b),worst=pick("rec",(a,b)=>a<b),maxS=pick("strain",(a,b)=>a>b);
const cnt=z=>D.filter(d=>d.zone===z).length;
const wz=zoneOf(A.rec),WC=COL[wz==="n"?"g":wz];
document.documentElement.style.setProperty('--glow',rgb(WC));

/* 头部 */
$("rg").textContent=(m0?Y0+" · ":"")+D[0].md+" – "+D[N-1].md;
$("lede").innerHTML=`${N} 天记录 · 周均恢复 <span class="num" style="color:${WC}">${r0(A.rec)}%</span> · 平均睡眠 <span class="num">${hm(A.sh)}</span>`;

/* 概览：圆环 */
function ring(p,color,big,unit,label,note){const r=42,c=+(2*Math.PI*r).toFixed(2);p=ok(p)?Math.max(0,Math.min(1,p)):0;
 return `<div class="ring"><div class="gauge"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" class="trk"/><circle cx="50" cy="50" r="${r}" class="arc" stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${(c*(1-p)).toFixed(2)}" transform="rotate(-90 50 50)"/></svg><div class="rv"><b style="color:${color}">${big}</b><small>${unit}</small></div></div><div class="rl">${label}</div><div class="rn">${note}</div></div>`;}
$("rings").innerHTML=ring(A.rec/100,WC,r0(A.rec),"%","恢复",ZN[wz])+ring(A.str/21,COL.strain,f1(A.str),"/ 21","负荷","日均 Strain")+ring(A.slp/100,COL.sleep,r0(A.slp),"%","睡眠","睡眠表现");
$("trio").innerHTML=[["平均睡眠",hm(A.sh),""],["平均 HRV",r0(A.hrv),"ms"],["静息心率",r0(A.rhr),"bpm"]].map(x=>`<div><div class="k">${x[0]}</div><div class="v">${x[1]}<small>${x[2]}</small></div></div>`).join("");
$("vd").textContent={g:"恢复充沛的一周，身体状态在线",y:"恢复中等的一周，还有提升空间",r:"恢复偏低的一周，身体在透支",n:"本周数据不足"}[wz];
$("chips").innerHTML=[["g","绿区"],["y","黄区"],["r","红区"]].map(([z,t])=>`<span class="chip"><i style="background:${COL[z]}"></i>${t} <b>${cnt(z)}</b> 天</span>`).join("");

/* 概览：本周节奏矩阵 */
(function(){const hv=D.map(d=>d.hrv).filter(ok),hmn=Math.min(...hv),hmx=Math.max(...hv);
 const R=[["恢复",d=>ok(d.rec)?[COL[d.zone],.12+.26*d.rec/100,Math.round(d.rec)]:null],
  ["睡眠",d=>ok(d.sh)?[COL.sleep,.07+.33*Math.min(1,d.sh/9),(+d.sh).toFixed(1)]:null],
  ["负荷",d=>ok(d.strain)?[COL.strain,.07+.35*Math.min(1,d.strain/21),(+d.strain).toFixed(1)]:null],
  ["HRV",d=>ok(d.hrv)?[COL.hrv,.07+.33*(hmx>hmn?(d.hrv-hmn)/(hmx-hmn):.5),Math.round(d.hrv)]:null]];
 let s=`<div></div>`+D.map(d=>`<div class="h">${d.w}<small>${d.md}</small></div>`).join("");
 R.forEach(([lb,fn])=>{s+=`<div class="lb">${lb}</div>`+D.map(d=>{const v=fn(d);return v?`<div class="c" style="background:${rgba(v[0],v[1])};color:${v[0]}">${v[2]}</div>`:`<div class="c" style="background:rgba(255,255,255,.03);color:var(--tx3)">—</div>`}).join("");});
 const el=$("hm");el.style.setProperty("--n",N);el.innerHTML=s;})();

/* 概览：本周小结（全部按当周数据生成） */
(function(){const L=[],n=v=>`<span class="num">${v}</span>`;
 if(best&&worst)L.push(`最佳 <b>${best.wd} ${best.md}</b>，恢复 ${n(best.rec+"%")}；最差 <b>${worst.wd} ${worst.md}</b>，${n(worst.rec+"%")}。`);
 const a=D.filter(d=>ok(d.sh)&&ok(d.rec)),hi=a.filter(d=>d.sh>=7),lo=a.filter(d=>d.sh<7);
 if(hi.length&&lo.length)L.push(`睡满 7 小时的 ${n(hi.length)} 天，平均恢复 ${n(r0(avg(hi.map(d=>d.rec)))+"%")}；不足 7 小时的 ${n(lo.length)} 天，平均 ${n(r0(avg(lo.map(d=>d.rec)))+"%")}。`);
 else if(a.length)L.push(hi.length?`本周每天都睡满了 7 小时，平均 ${n(hm(A.sh))}。`:`本周没有一天睡满 7 小时，平均只有 ${n(hm(A.sh))}。`);
 if(maxS)L.push(`负荷最高在 <b>${maxS.wd} ${maxS.md}</b>（${n(f1(maxS.strain))}，${lvl(maxS.strain)}），日均 ${n(f1(A.str))}。`);
 const hv=D.map(d=>d.hrv).filter(ok);if(hv.length>1)L.push(`HRV 在 ${n(Math.round(Math.min(...hv))+"–"+Math.round(Math.max(...hv)))} ms 之间波动，均值 ${n(r0(A.hrv))} ms。`);
 $("ins").innerHTML=L.map(x=>`<li>${x}</li>`).join("");})();

/* 分页头部 */
function ph(id,k,big,color,meta){$(id).innerHTML=`<div class="k">${k}</div><div class="big" style="color:${color}">${big}</div><div class="meta">${meta.map(m=>`<span>${m[0]}<b>${m[1]}</b></span>`).join("")}</div>`;}
ph("phRec","周均恢复",`${r0(A.rec)}<small>%</small>`,WC,[["最佳",best?best.md+" · "+best.rec+"%":"—"],["最差",worst?worst.md+" · "+worst.rec+"%":"—"],["绿区",cnt("g")+" 天"]]);
const shN=D.filter(d=>ok(d.sh)).length,goalN=D.filter(d=>ok(d.sh)&&d.sh>=7).length;
const shm=ok(A.sh)?Math.round(A.sh*60):null;
ph("phSlp","平均睡眠",shm==null?"—":`${Math.floor(shm/60)}<small>h</small>${String(shm%60).padStart(2,"0")}<small>m</small>`,COL.sleep,[["达标 ≥7h",goalN+"/"+shN+" 天"],["睡眠表现",r0(A.slp)+"%"],["效率",r0(A.eff)+"%"]]);
const hiS=D.filter(d=>ok(d.strain)&&d.strain>=14).length;
ph("phStr","日均负荷",`${f1(A.str)}<small>/ 21</small>`,COL.strain,[["最高",maxS?maxS.md+" · "+f1(maxS.strain):"—"],["高负荷 ≥14",hiS+" 天"],["整体强度",ok(A.str)?lvl(A.str):"—"]]);

/* 图表公共 */
const W=400,PL=30,PR=12;
const X=i=>N<2?(PL+(W-PL-PR)/2):PL+8+(W-PL-PR-16)*i/(N-1);
const xlab=H=>D.map((d,i)=>`<text x="${X(i).toFixed(1)}" y="${H-16}" fill="${COL.tx2}" font-size="11" text-anchor="middle" style="font-family:var(--sans)">${d.w}</text><text x="${X(i).toFixed(1)}" y="${H-3}" fill="${COL.tx3}" font-size="9" text-anchor="middle">${d.md}</text>`).join("");
function smooth(P){if(!P.length)return"";let s=`M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2,t=.18;s+=` C${(p1[0]+(p2[0]-p0[0])*t).toFixed(1)},${(p1[1]+(p2[1]-p0[1])*t).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])*t).toFixed(1)},${(p2[1]-(p3[1]-p1[1])*t).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;}return s;}
const put=(id,H,s)=>{const el=$(id);el.setAttribute("viewBox",`0 0 ${W} ${H}`);el.innerHTML=s;};

/* 恢复度走势：线条颜色随区间渐变 */
(function(){const H=232,T=24,B=H-38,y=v=>T+(B-T)*(1-v/100);
 let s=`<defs><linearGradient id="gz" gradientUnits="userSpaceOnUse" x1="0" y1="${y(100)}" x2="0" y2="${y(0)}"><stop offset=".28" stop-color="${COL.g}"/><stop offset=".40" stop-color="${COL.y}"/><stop offset=".60" stop-color="${COL.y}"/><stop offset=".72" stop-color="${COL.r}"/></linearGradient><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${WC}" stop-opacity=".22"/><stop offset="1" stop-color="${WC}" stop-opacity="0"/></linearGradient></defs>`;
 [0,100].forEach(v=>{s+=`<line x1="${PL}" x2="${W-PR}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.06)"/>`;});
 [[34,COL.r],[67,COL.g]].forEach(([v,c])=>{s+=`<line x1="${PL}" x2="${W-PR}" y1="${y(v)}" y2="${y(v)}" stroke="${rgba(c,.35)}" stroke-dasharray="2 4"/><text x="${PL-6}" y="${y(v)+3.5}" fill="${rgba(c,.85)}" font-size="9.5" text-anchor="end">${v}</text>`;});
 const P=D.map((d,i)=>ok(d.rec)?[X(i),y(d.rec),d]:null).filter(Boolean);
 if(P.length){const p=smooth(P);s+=`<path d="${p} L${P[P.length-1][0].toFixed(1)},${B} L${P[0][0].toFixed(1)},${B} Z" fill="url(#ga)"/><path d="${p}" fill="none" stroke="url(#gz)" stroke-width="2.5" stroke-linecap="round"/>`;}
 if(ok(A.rec))s+=`<line x1="${PL}" x2="${W-PR}" y1="${y(A.rec)}" y2="${y(A.rec)}" stroke="rgba(255,255,255,.3)" stroke-dasharray="4 4"/><text x="${W-PR}" y="${y(A.rec)-5}" fill="${COL.tx2}" font-size="9.5" text-anchor="end">均 ${r0(A.rec)}</text>`;
 P.forEach(([px,py,d])=>{const c=COL[d.zone];s+=(d===best?`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="10" fill="${rgba(c,.18)}"/>`:"")+`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="4.5" fill="#08090b" stroke="${c}" stroke-width="2.2"/><text x="${px.toFixed(1)}" y="${(py-12).toFixed(1)}" fill="${c}" font-size="11.5" font-weight="600" text-anchor="middle">${d.rec}</text>`;});
 put("cRec",H,s+xlab(H));})();

/* HRV / 静息心率 小图 */
function mini(id,key,color){const H=150,T=26,B=H-38,v=D.map(d=>d[key]).filter(ok);if(!v.length)return;
 let mn=Math.min(...v),mx=Math.max(...v);const pad=Math.max(2,(mx-mn)*.25);mn-=pad;mx+=pad;const y=x=>T+(B-T)*(1-(x-mn)/(mx-mn)),a=avg(v);
 let s=`<defs><linearGradient id="g${key}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;
 s+=`<line x1="${PL}" x2="${W-PR}" y1="${y(a)}" y2="${y(a)}" stroke="rgba(255,255,255,.22)" stroke-dasharray="4 4"/><text x="${PL-6}" y="${y(a)+3.5}" fill="${COL.tx3}" font-size="9.5" text-anchor="end">${Math.round(a)}</text>`;
 const P=D.map((d,i)=>ok(d[key])?[X(i),y(d[key]),d]:null).filter(Boolean),p=smooth(P);
 s+=`<path d="${p} L${P[P.length-1][0].toFixed(1)},${B} L${P[0][0].toFixed(1)},${B} Z" fill="url(#g${key})"/><path d="${p}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round"/>`;
 P.forEach(([px,py,d])=>{s+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3.5" fill="#08090b" stroke="${color}" stroke-width="2"/><text x="${px.toFixed(1)}" y="${(py-10).toFixed(1)}" fill="${color}" font-size="10.5" text-anchor="middle">${Math.round(d[key])}</text>`;});
 put(id,H,s+xlab(H));}
mini("cHrv","hrv",COL.hrv);mini("cRhr","rhr",COL.rhr);

/* 柱状图 */
function bars(id,key,max,ticks,color,o){const H=o.H||200,T=26,B=H-(o.dots?50:38),y=v=>T+(B-T)*(1-Math.min(v,max)/max),bw=Math.min(24,(W-PL-PR)/N*.5);
 let s=`<defs><linearGradient id="b${key}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}"/><stop offset="1" stop-color="${color}" stop-opacity=".5"/></linearGradient></defs>`;
 ticks.forEach(t=>{s+=`<line x1="${PL}" x2="${W-PR}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(255,255,255,.06)"/><text x="${PL-6}" y="${y(t)+3.5}" fill="${COL.tx3}" font-size="9.5" text-anchor="end">${t}</text>`;});
 if(o.goal!=null){const gy=y(o.goal);s+=`<line x1="${PL}" x2="${W-PR}" y1="${gy}" y2="${gy}" stroke="${rgba(color,.75)}" stroke-dasharray="4 4"/><text x="${PL-6}" y="${gy+3.5}" fill="${color}" font-size="9.5" text-anchor="end">${o.goal}</text>`;}
 D.forEach((d,i)=>{const v=d[key],cx=X(i);if(o.dots)s+=`<circle cx="${cx.toFixed(1)}" cy="${B+10}" r="3.5" fill="${COL[d.zone]}"/>`;
  if(!ok(v)){s+=`<text x="${cx.toFixed(1)}" y="${B-4}" fill="${COL.tx3}" font-size="10" text-anchor="middle">—</text>`;return}
  const yy=y(v),dim=o.dim&&o.dim(v);s+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(2,B-yy).toFixed(1)}" rx="${Math.min(6,bw/2).toFixed(1)}" fill="url(#b${key})" opacity="${dim?.38:1}"/><text x="${cx.toFixed(1)}" y="${(yy-7).toFixed(1)}" fill="${dim?COL.tx2:"#fff"}" font-size="10.5" font-weight="600" text-anchor="middle">${o.fmt(v)}</text>`;});
 put(id,H,s+xlab(H));}
bars("cSlp","sh",10,[0,5,10],COL.sleep,{fmt:hm,goal:7,dim:v=>v<7});
bars("cStr","strain",21,[0,10,14,18],COL.strain,{fmt:f1,dots:true,H:214});

/* 明细列表 */
function rows(id,fn){$(id).innerHTML=D.map(d=>{const r=fn(d);return `<div class="row"><div class="d">${d.wd}<small>${d.md}</small></div><div class="track">${r.fill||""}${r.goal||""}</div><div class="v" style="color:${r.c}">${r.v}<small>${r.sub}</small></div></div>`}).join("");}
rows("lRec",d=>({fill:ok(d.rec)?`<i style="width:${d.rec}%;background:${COL[d.zone]}"></i>`:"",c:COL[d.zone],v:ok(d.rec)?d.rec+"%":"—",sub:`HRV ${r0(d.hrv)} · 心率 ${r0(d.rhr)}`}));
rows("lSlp",d=>({fill:ok(d.sh)?`<i style="width:${Math.min(100,d.sh/10*100)}%;background:${d.sh>=7?COL.sleep:rgba(COL.sleep,.42)}"></i>`:"",goal:`<span class="goal" style="left:70%"></span>`,c:ok(d.sh)&&d.sh>=7?"#fff":COL.tx2,v:hm(d.sh),sub:`表现 ${r0(d.slp)}% · 效率 ${r0(d.eff)}%`}));
rows("lStr",d=>({fill:ok(d.strain)?`<i style="width:${Math.min(100,d.strain/21*100)}%;background:linear-gradient(90deg,${rgba(COL.strain,.45)},${COL.strain})"></i>`:"",c:"#fff",v:f1(d.strain),sub:ok(d.strain)?`${lvl(d.strain)} · 恢复 ${r0(d.rec)}%`:"—"}));

/* 恢复点评 */
(function(){const low=D.filter(d=>ok(d.sh)&&d.sh<7).length,n=v=>`<span class="num">${v}</span>`;let c;
 if(low>=Math.ceil(N/2))c=`本周有 ${n(low)} 天睡不足 7 小时，睡眠不足是拉低恢复的主因`;
 else if(ok(A.hrv)&&A.hrv<45)c=`本周 HRV 平均偏低（${n(r0(A.hrv))} ms），身体压力偏大`;
 else if(ok(A.rhr)&&A.rhr>58)c=`本周静息心率偏高（${n(r0(A.rhr))} bpm），多为疲劳或负荷偏大`;
 else c=`本周各项基本在正常区间，恢复相对稳定`;
 $("nRec").innerHTML=`<span class="t">点评</span><span>${c}。${low>0?"把“睡满 7h + 作息规律”做稳，是最直接的提升点。":"保持当前作息，留意 HRV 别往下掉。"}</span>`;})();

/* Tab 切换（支持 #rec / #slp / #str 直达） */
if(location.search.indexOf('still')>-1)document.documentElement.classList.add('still');
const tabs=[...document.querySelectorAll(".seg button")];
function show(t){tabs.forEach(b=>b.classList.toggle("on",b.dataset.t===t));document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id==="p-"+t));}
tabs.forEach(b=>b.addEventListener("click",()=>{show(b.dataset.t);try{history.replaceState(null,"","#"+b.dataset.t)}catch(e){}window.scrollTo({top:0,behavior:"smooth"});}));
const h0=(location.hash||"").slice(1);if(["ov","rec","slp","str"].includes(h0))show(h0);
requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll(".arc").forEach(a=>a.style.strokeDashoffset=a.dataset.off)));
</script></body></html>
